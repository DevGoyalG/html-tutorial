<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/server">
        <label for="feedback">Please give your valuable feedback :</label>
        <br>
        <textarea id="feedback" name="feedback"></textarea>
        <br>
        <textarea id="feedback" name="feedback" placeholder="write your feedback here"></textarea>
        <br>
        <textarea id="feedback" name="feedback" rows="5"></textarea>
        <br>
        <textarea id="feedback" name="feedback" cols="100"></textarea>
        <br>
        <textarea id="feedback" name="feedback" rows="10" cols="100"></textarea>
        <br>
        <button>Submit</button>
    </form>
</body>
</html>
